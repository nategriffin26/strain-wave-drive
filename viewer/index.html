<script>
(() => {
  const system = matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try { preference = localStorage.getItem('strain-wave-theme') || 'system'; } catch {}
  if (!['system', 'dark', 'light'].includes(preference)) preference = 'system';
  function applyTheme() {
    const theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    document.querySelectorAll('meta[name="theme-color"]').forEach(meta => { meta.content = theme === 'dark' ? '#0a0d13' : '#f5f7fb'; });
    const toggle = document.getElementById('theme');
    if (toggle) {
      toggle.setAttribute('aria-label', `Theme: ${preference[0].toUpperCase() + preference.slice(1)}`);
      toggle.title = toggle.getAttribute('aria-label');
    }
    dispatchEvent(new CustomEvent('viewer-theme', {detail: theme}));
  }
  applyTheme();
  system.addEventListener('change', () => { if (preference === 'system') applyTheme(); });
  addEventListener('DOMContentLoaded', () => {
    applyTheme();
    document.getElementById('theme').addEventListener('click', () => {
      preference = ['system', 'light', 'dark'][(['system', 'light', 'dark'].indexOf(preference) + 1) % 3];
      try { if (preference === 'system') localStorage.removeItem('strain-wave-theme'); else localStorage.setItem('strain-wave-theme', preference); } catch {}
      applyTheme();
    });
  });
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const PLAYBACK = [0.02, 0.1, 0.5, 1];
const ROLES = new Set(['ground', 'input', 'carrier', 'planet', 'flex', 'output']);
const MATERIALS = new Set(['flex', 'printed', 'printed_accent', 'steel', 'brass', 'motor']);
const groupLabels = {
  planetary: {ground: 'Housing', input: 'Sun and shaft', carrier: 'Wave generator', planet: 'Planets', flex: 'Flexspline', output: 'Output drum'},
  plain: {ground: 'Housing', input: 'Motor shaft', carrier: 'Wave generator', planet: 'Rollers', flex: 'Flexspline', output: 'Output drum'},
};
const materialSpecs = {flex: {metalness: 0, roughness: 0.56}, printed: {metalness: 0.02, roughness: 0.51}, printed_accent: {metalness: 0.02, roughness: 0.51},
  steel: {metalness: 0.75, roughness: 0.3}, brass: {metalness: 0.65, roughness: 0.36}, motor: {metalness: 0.25, roughness: 0.5}};
const params = new URLSearchParams(location.search);
const state = {
  preset: params.get('preset') === 'plain' ? 'plain' : 'planetary',
  report: null, assembly: null, paused: matchMedia('(prefers-reduced-motion: reduce)').matches,
  inputAngle: 0, rpm: 60, playback: 0.1, explode: 0, hardware: true,
  groupOpacity: new Map(), partOpacity: new Map(), loading: false,
};

const viewport = $('viewport');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
} catch (error) {
  showNotice('WebGL is unavailable. Enable hardware acceleration or use a WebGL-capable browser.', true);
  throw error;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
viewport.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const room = new RoomEnvironment();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(room, 0.04).texture;
room.dispose(); pmrem.dispose();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 10000);
camera.up.set(0, 0, 1);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
const hemisphere = new THREE.HemisphereLight(0xffffff, 0x67716c, 0.6);
scene.add(hemisphere);
const studioLights = [[100, -150, 220, 2], [-150, 10, 90, 0.5], [80, 140, 30, 0.8]].map(([x, y, z, intensity]) => {
  const light = new THREE.DirectionalLight(0xffffff, intensity);
  light.position.set(x, y, z);
  scene.add(light);
  return light;
});
let inkColors;
function applySceneTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const css = getComputedStyle(document.documentElement), color = token => new THREE.Color(css.getPropertyValue(token).trim());
  const printed = color('--muted').lerp(color('--faint'), 0.3);
  inkColors = {flex: color('--pa6'), printed, printed_accent: printed.clone().lerp(color('--fg-2'), 0.25), steel: color('--muted').lerp(color('--fg-2'), 0.5),
    brass: color('--muted'), motor: color('--faint'), tick: color(dark ? '--bg' : '--fg')};
  hemisphere.groundColor.setHex(dark ? 0x536078 : 0xabb5c8);
  for (const part of state.assembly?.parts || []) {
    for (const mesh of part.meshes) mesh.material.color.copy(inkColors[part.meta.material]);
    part.tick?.material.color.copy(inkColors.tick);
  }
}
addEventListener('viewer-theme', applySceneTheme);
applySceneTheme();
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const rotation = new THREE.Matrix4(), translation = new THREE.Matrix4(), motion = new THREE.Matrix4(), desiredWorld = new THREE.Matrix4(), inverseParent = new THREE.Matrix4();

function showNotice(text, error = false) {
  $('notice').hidden = !text;
  $('notice').textContent = text;
  $('notice').classList.toggle('error', error);
}
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function paintRange(input) {
  const span = Number(input.max) - Number(input.min);
  input.style.setProperty('--fill', `${span ? 100 * (Number(input.value) - Number(input.min)) / span : 0}%`);
}
document.addEventListener('input', event => { if (event.target.matches('input[type=range]')) paintRange(event.target); });
function number(value, digits = 2) {
  return Number.isFinite(value) ? (value === 0 ? 0 : value).toLocaleString(undefined, {maximumFractionDigits: digits}).replace('-', '−') : '—';
}
const finite = value => Number.isFinite(value) && value !== 0;

// The report's motion block is the only source of kinematics; anything missing is an error, not a default.
function validMotion(report) {
  const m = report?.motion;
  if (!m) throw new Error('report.json has no motion block.');
  const r = m.ratios || {};
  if (!finite(r.motor_to_output) || !finite(r.motor_to_carrier)) throw new Error('report.json motion has no signed motor-to-output and motor-to-carrier ratios.');
  const planetRatio = m.variant === 'plain' ? r.motor_to_roller : r.motor_to_planet;
  if (m.parts?.some(p => p.role === 'planet') && !finite(planetRatio)) throw new Error(`report.json motion has no ${m.variant === 'plain' ? 'motor_to_roller' : 'motor_to_planet'} ratio.`);
  const w = m.wave;
  if (w?.model !== 'sampled_neutral_curve' || !(w.neutral_radius_mm > 0) || !Array.isArray(w.samples) || w.samples.length < 8
      || w.samples.some(row => row.length < 4 || row.some(v => !Number.isFinite(v)))) {
    throw new Error('report.json motion has no sampled neutral curve for the flex.');
  }
  if (!Array.isArray(m.parts) || !m.parts.length) throw new Error('report.json motion lists no parts.');
  for (const p of m.parts) {
    if (!p.id || !ROLES.has(p.role) || !MATERIALS.has(p.material) || !Array.isArray(p.pivot_mm) || p.pivot_mm.length !== 3 || p.pivot_mm.some(v => !Number.isFinite(v))) {
      throw new Error(`report.json motion part “${p.id}” lacks a valid role, material or pivot.`);
    }

// GPU deformation of the neutral flex: material angle q = atan2(y, x) + flexAngle − waveAngle picks a row
// of the sampled neutral curve; the vertex keeps its radial offset along the sampled normal; the result
// turns with the wave generator. Row 1 holds curvature and arc speed so normals map with the surface.
const FLEX_VERTEX_SHADER = `
uniform sampler2D waveMap;
uniform vec4 waveMotion;
uniform float neutralRadius;
uniform mat4 flexToWorld;
uniform mat4 flexToLocal;
uniform mat3 flexNormalToWorld;
uniform mat3 flexNormalToLocal;
void flexDeform(vec3 originalPosition, vec3 originalNormal, out vec3 resultPosition, out vec3 resultNormal) {
  vec3 p = (flexToWorld * vec4(originalPosition, 1.0)).xyz;
  vec3 normal = normalize(flexNormalToWorld * originalNormal);
  float radius = length(p.xy);
  vec2 radialAxis = p.xy / radius;
  float q = mod(atan(p.y, p.x) + waveMotion.x, 6.283185307179586);

function updateGeometry() {
  const assembly = state.assembly;
  if (!assembly) return;
  const r = assembly.motion.ratios, S = state.inputAngle;

      else if (meta.role === 'input') motion.makeRotationZ(S);

async function showPreset(preset) {
  if (state.loading) return;
  state.loading = true;
  const previous = state.preset;
  state.preset = preset;
  updateReadouts();
  if (!state.assembly) showNotice('');
  try {
    const {assembly, report} = await loadAssembly(preset);
    disposeAssembly(state.assembly);
    Object.assign(state, {assembly, report, inputAngle: 0});
    for (const part of assembly.parts) if (!state.groupOpacity.has(groupKey(part.meta))) state.groupOpacity.set(groupKey(part.meta), part.meta.role === 'output' ? 0.12 : 1);

    const url = new URL(location.href);
    if (preset === 'planetary') url.searchParams.delete('preset'); else url.searchParams.set('preset', preset);

$('rpm').addEventListener('input', () => { state.rpm = Number($('rpm').value); updateReadouts(); });
$('playback').addEventListener('input', () => { state.playback = PLAYBACK[Number($('playback').value)]; updateReadouts(); });
$('pause').addEventListener('click', () => {
  const wasSeparated = state.explode > 0;

  state.paused = !state.paused; updateGeometry(); updateReadouts();
